<style>
    .loader {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 2000;
        background-color: rgba(24, 24, 35, 1);
        display: grid;
        place-items: center;
        color: white;


    }

    .loader::before {
        content: '';
        position: absolute;
        inset: 0;
        width: 50px;
        height: 50px;
        background-color: green;
        border-radius: 50%;
        margin: auto;
        display: none;
    }

    body:has(.loader) {
        touch-action: none;
        -webkit-overflow-scrolling: none;
        overflow: hidden;
        overscroll-behavior: none;
    }

    .loader__logo {
        width: 380px;
        clip-path: inset(0 91% 0 0);
        transform: translateX(45.5%);

    }

    .loader__logo svg {
        display: block;
        width: 100%;
        height: auto;
    }

    .loader__progress {
        position: absolute;
        left: 0;
        bottom: 40px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 42px;
        width: 100%;

    }

    .loader__progress-percentage {
        align-self: flex-end;
        margin-right: 40px;
        font-size: 110px;
        font-style: normal;
        font-weight: 300;
        line-height: 100%;
        font-family: "Core Sans", sans-serif;
        letter-spacing: -8.8px;
        color: rgba(255, 255, 255, 0.1);
    }

    .loader__progress-bar {
        height: 4px;
        background-color: rgba(255, 255, 255, 0.1);
        position: relative;
        width: 100%;
    }

    .loader__progress-bar span {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
        background-color: #fff;
    }

    @media (max-width: 640px) {
        .loader__logo {
            width: 270px;
        }

        .loader__progress-bar {
            height: 2px;

        }

        .loader__progress {
            gap: 10px;
            bottom: 20px;
        }

        .loader__progress-percentage {
            margin-right: 20px;
            font-size: 40px;
            letter-spacing: -2px;
        }
    }
</style>

<div class="loader">
    <div class="loader__inner">
        <div class="loader__logo">
            {{> loader-logo }}
        </div>
    </div>
    <div class="loader__progress">
        <div class="loader__progress-percentage">
            <span>0</span>%
        </div>
        <div class="loader__progress-bar">
            <span></span>
        </div>
    </div>
</div>
